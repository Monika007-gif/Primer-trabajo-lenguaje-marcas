<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Probando nuevos tipos de formularios</h1>
    <form action="validar.php" method="get">

    <p>Vamos a probar diferentes valores de type de HTML5 para la etiqueta input.</p>
    
    <!-- DATOS PERSONALES --> <fieldset><legend>Datos personales</legend>
    

    <label for="telefono">Teléfono:</label><input type="tel" id="telefono" name="telefono" size="9"
    placeholder="9 números" pattern="[0-9]{9}" autocomplete="on">
    <br></br>
    <label for="correo">Correo electrónico:</label>
<input type="email" id="correo" name="correo" size="50" placeholder="El formato correcto es nombre+@+servidor de correo"
    autocomplete="on" required>
    </fieldset>
<br>
    <!-- VALORES NUMÉRICOS --> <fieldset><legend>Valores numéricos</legend>

<label for="personas">Número de personas:</label>
<input type="number" id="personas" name="personas" min="1" max="20" step="1" value="1">
<br><br>
<label for="puntuacion">Puntuación:</label>
<input type="range" id="puntuacion" name="puntuacion" min="0" max="10" step="1" value="0">
</fieldset>
<br>

<!--URL Y BÚSQUEDA --><fieldset><legend>URL y búsqueda</legend>
<label for="web">URL:</label>
<input type="url" id="web" name="web"
placeholder="https://www.ejemplo.com" required>
<br><br>
<label for="buscar">¿Qué te interesa buscar?</label>
<input type="search" id="buscar" name="buscar"></fieldset>
<br>
<!--Otros tipos --><fieldset><legend>Otros tipos</legend>
<label for="color">Color:</label>
<input type="color" id="color" name="color"></fieldset>
<br>
<!--FECHAS--><fieldset><legend>Fechas</legend>
<label for="fecha">Seleccione fecha (hasta fin de año):</label>
<input type="date" id="fecha" name="fecha"
max="2026-12-31">
<br><br>
<label for="hora">Seleccione una hora:</label>
<input type="time" id="hora" name="hora">
<br><br>
<label for="mes">Seleccione un mes:</label>
<input type="month" id="mes" name="mes">
<br><br>
<label for="semana">Seleccione una semana:/</label>
<input type="week" id="semana" name="semana">
<br><br>
<label for="fechahora">Seleccione fecha y hora:</label>
<input type="datetime-local" id="fechahora" name="fechahora"></fieldset>
<br>
<!--BOTONES-->
<button type="submit">
    <img src="aceptar_50_50.png" alt="Validar">
    </button>
    <button type="reset">
        <img src="limpiar_50_50.jpg" alt="limpiar">
    </button>
    <button type="submit" formaction="nueva_validacion.php">Enviar a nueva validación</button>


</form>
     
</body>
</html>
