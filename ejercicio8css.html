<!DOCTYPE html>
<html lang="es">
<head>

<style>

li:first-child {
    color: blue;
    font-size: 12px;
}

li:nth-child(2),
li:nth-child(4) {
    color: red;
    font-size: 24px;
}


li:nth-child(3) {
    color: rgb(205, 177, 50);
    font-size: 16px;
}

li:last-child {
    color: green;
    font-size: 30px;
}

</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio de pseudo-clases</title>
</head>



<body>

    <ul><li>Primero</li>
<li>Segundo</li>
<li>Tercero</li>
<li>Cuarto</li>
<li>Quinto</li>
</ul>


</body>


</html>
